<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Configurá tu voz</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card">
      <h1>Configurá tu voz</h1>

      <section id="logged-out" hidden>
        <p>Iniciá sesión con tu cuenta de Twitch para confirmar que sos vos.</p>
        <a class="button" id="login-link" href="/viewer-auth/login">Iniciar sesión con Twitch</a>
      </section>

      <section id="logged-in" hidden>
        <p class="who">
          Conectado como <strong id="display-name"></strong>
          <button class="link" id="logout-button" type="button">cerrar sesión</button>
        </p>

        <form id="preferences-form">
          <label for="voice-select">Voz</label>
          <select id="voice-select" name="voiceId"></select>

          <label for="volume-range">Volumen: <span id="volume-value"></span></label>
          <input id="volume-range" name="volume" type="range" min="0" max="1" step="0.05" />

          <label for="pitch-range">Tono (pitch): <span id="pitch-value"></span></label>
          <input id="pitch-range" name="pitch" type="range" min="0" max="2" step="0.05" />

          <label for="timbre-range">Timbre: <span id="timbre-value"></span></label>
          <input id="timbre-range" name="timbre" type="range" min="0" max="2" step="0.05" />

          <button class="button secondary" id="preview-button" type="button">🔊 Probar voz</button>
          <p id="preview-status" role="status"></p>

          <button class="button" type="submit">Guardar</button>
          <p id="save-status" role="status"></p>
        </form>
      </section>

      <section id="loading">
        <p>Cargando…</p>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
